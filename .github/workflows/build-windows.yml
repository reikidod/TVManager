name: Build Windows package

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\TVManager.sln

      - name: Build
        run: dotnet build .\TVManager.sln --configuration Release --no-restore

      - name: Publish self-contained Windows x64 package
        shell: pwsh
        run: .\scripts\Publish-Windows.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVManager-win-x64
          path: artifacts/TVManager-0.1.2-win-x64.zip
          if-no-files-found: error
          retention-days: 30
